[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "requisite-ai"
version = "0.31.0"
description = "A provider-agnostic, plugin-based framework for building AI applications and agents. Declare what you need -- providers, tools, capabilities -- not which SDK provides it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai", "agents", "llm", "openai", "gemini", "ollama", "agentic", "orchestration", "mcp", "rag"]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.urls]
Homepage = "https://github.com/requisite-ai/requisite-ai"
Repository = "https://github.com/requisite-ai/requisite-ai"

[project.scripts]
requisite = "requisite.cli.main:main"

[project.optional-dependencies]
openai = ["openai>=1.35"]
gemini = ["google-genai>=1.0"]
anthropic = ["anthropic>=0.116"]
groq = ["openai>=1.35"]          # Groq is OpenAI-wire-compatible; no separate SDK needed
azure_openai = ["openai>=1.35"]  # Azure OpenAI v1 GA API also uses the plain openai client
openrouter = ["openai>=1.35"]    # OpenRouter is OpenAI-wire-compatible; no separate SDK needed
together = ["openai>=1.35"]      # Together AI is OpenAI-wire-compatible; no separate SDK needed
ollama = ["ollama>=0.6"]         # native client -- Ollama's own OpenAI-compat endpoint is experimental
# langgraph>=0.2 predated the 1.0 API stabilization and gave no real
# guarantee about add_conditional_edges'/Send's current shape. Bumped
# to >=1.0 to honestly reflect what's actually verified (1.2.9,
# installed and exercised directly for the supervisor conditional graph).
# See CHANGELOG.md and docs/adr/0016-langgraph-branching.md.
langgraph = ["langgraph>=1.0"]
# mcp 2.0.0 is a breaking rewrite (restructured package layout, renamed
# CallToolResult.isError/structuredContent -> is_error/structured_content,
# removed streamablehttp_client in favor of streamable_http_client, and
# rewrote the low-level Server's handler registration from post-
# construction decorators to constructor kwargs) -- migrated to as its
# own deliberate change per this policy, not under CI-failure pressure.
# See CHANGELOG.md and docs/adr/0025-mcp-2x-migration.md. No dual 1.x/2.x
# support -- a hard cutover, since mcp is an optional extra and this
# project is pre-1.0.
mcp = ["mcp>=2.0,<3.0"]
pinecone = ["pinecone>=9.0"]        # current package name; the older "pinecone-client" is deprecated
weaviate = ["weaviate-client>=4.0"]  # v4 client API; v3's weaviate.Client(...) is a different, older API
rag = ["openai>=1.35", "google-genai>=1.0"]  # embedding providers; no vector-store SDK needed for the in-memory default
redis = ["redis>=5.0"]  # ships both sync redis.Redis and (4.2+) redis.asyncio.Redis -- no separate aioredis package
# API only, deliberately -- the application installs opentelemetry-sdk
# plus whichever exporter it wants and configures the provider; see
# docs/adr/0021-opentelemetry-tracing-and-metrics.md.
otel = ["opentelemetry-api>=1.20"]
# crewai (1.15.17, verified) hard-pins mcp~=1.28.1 (confirmed directly via
# `pip install`, not assumed) -- a genuine, unavoidable conflict with this
# project's own mcp>=2.0,<3.0 requirement (ADR-0025). Installing both in
# the same environment downgrades one or the other depending on install
# order; there is no version range that satisfies both today. Deliberately
# NOT added to the `all` extra for this reason -- see
# docs/adr/0027-crewai-autogen-orchestrator-backends.md.
crewai = ["crewai>=1.15"]
autogen = ["autogen-agentchat>=0.7", "autogen-core>=0.7"]
all = [
    "openai>=1.35",
    "google-genai>=1.0",
    "anthropic>=0.116",
    "ollama>=0.6",
    "langgraph>=1.0",
    "mcp>=2.0,<3.0",
    "pinecone>=9.0",
    "weaviate-client>=4.0",
    "redis>=5.0",
    "opentelemetry-api>=1.20",
    "autogen-agentchat>=0.7",
    "autogen-core>=0.7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff==0.14.14",
    "mypy==2.3.0",
    "opentelemetry-sdk>=1.20",  # test-only, to assert real spans/metrics via in-memory exporters
]

[tool.setuptools.packages.find]
include = ["requisite*"]

[tool.setuptools.package-data]
requisite = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

# These SDKs are optional (installed only if you use that provider/backend)
# and imported lazily inside a try/except at call time -- don't fail
# type-checking for users who haven't installed all of them.
[[tool.mypy.overrides]]
module = [
    "openai.*",
    "google.*",
    "anthropic.*",
    "langgraph.*",
    "mcp.*",
    "ollama.*",
    "pinecone.*",
    "weaviate.*",
    "redis.*",
    "opentelemetry.*",
    "autogen_agentchat.*",
    "autogen_core.*",
]
ignore_missing_imports = true

# crewai's own dependency tree pulls in a numpy version whose bundled
# .pyi stubs use PEP 695 `type` statement syntax (Python 3.12+ only),
# which mypy can't parse under this project's python_version = "3.10"
# target -- a real stub-vs-target-version conflict, not something fixable
# in requisite's own code. follow_imports="skip" stops mypy from
# descending into crewai's (and therefore numpy's) actual module content
# at all, treating their symbols as Any -- requisite itself never imports
# numpy directly, only crewai does, transitively. Needs skip specifically
# for crewai.* too, not just ignore_missing_imports -- crewai *is*
# installed (found), so ignore_missing_imports alone doesn't stop mypy
# from still walking into its numpy-importing internals.
[[tool.mypy.overrides]]
module = ["crewai.*", "numpy.*", "chromadb.*"]
follow_imports = "skip"
ignore_missing_imports = true
