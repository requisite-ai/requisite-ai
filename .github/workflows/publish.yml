name: Publish to PyPI

# Triggered when a GitHub Release is published. Uses PyPI's trusted
# publishing (OIDC) -- no API token needs to be stored as a secret.
# One-time setup required before this will work: on pypi.org, under your
# project (or as a *pending* publisher before the first release), add a
# trusted publisher with:
#   Owner: <requisite-ai>   Repository: requisite-ai
#   Workflow: publish.yml   Environment: pypi
# See: https://docs.pypi.org/trusted-publishers/

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/requisite-ai
    permissions:
      id-token: write  # required for trusted publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
