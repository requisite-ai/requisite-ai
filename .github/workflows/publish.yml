name: Publish to PyPI

# Triggered when a GitHub Release is published (or manually via
# workflow_dispatch). Uses PyPI's trusted publishing (OIDC) -- no API
# token needs to be stored as a secret. One-time setup required before
# this will work: on pypi.org, under your project (or as a *pending*
# publisher before the first release), add a trusted publisher with:
#   Owner: <requisite-ai>   Repository: requisite-ai
#   Workflow: publish.yml   Environment: pypi
# See: https://docs.pypi.org/trusted-publishers/
#
# `verify` below re-runs ci.yml's full job graph (lint, type check, test
# matrix, build) as a reusable workflow before anything is built for
# publishing. This is a deliberate belt-and-suspenders gate: it doesn't
# rely on `main`'s branch protection alone to keep an unverified commit
# from reaching PyPI, since a manually triggered workflow_dispatch can
# target any branch/commit regardless of what protection main has.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: Verify (lint, type check, test, build)
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build distribution
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/requisite-ai
    permissions:
      id-token: write  # required for trusted publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
